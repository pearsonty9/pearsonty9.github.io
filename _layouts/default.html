<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the saved theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  {%- comment -%} Version query busts browser caches on every deploy. {%- endcomment %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f6fed'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'>TP</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">TP</a>
      <nav aria-label="Sections">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="when-light">{% include icon.html name="moon" %}</span>
        <span class="when-dark">{% include icon.html name="sun" %}</span>
      </button>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer container">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
    <p class="footer-links">
      {% for link in site.social %}<a href="{{ link.url }}">{{ link.name }}</a>{% endfor %}
    </p>
  </footer>

  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var dark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });

    document.querySelectorAll("[data-copy]").forEach(function (btn) {
      var label = btn.querySelector("[data-label]");
      var original = label.textContent;
      label.setAttribute("aria-live", "polite");
      btn.addEventListener("click", function () {
        var text = btn.dataset.copy;
        var show = function (message, ms) {
          label.textContent = message;
          btn.classList.add("copied");
          clearTimeout(btn._reset);
          btn._reset = setTimeout(function () {
            label.textContent = original;
            btn.classList.remove("copied");
          }, ms);
        };
        var copied = function () { show("Copied!", 1800); };
        // If copying is blocked, show the address so it can be copied by hand.
        var failed = function () { show(text, 8000); };

        // Copy synchronously first, while the click still counts as a user
        // gesture; async fallbacks after a rejected promise can lose that.
        if (copyNow(text)) return copied();
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(copied, failed);
        } else {
          failed();
        }
      });
    });

    function copyNow(text) {
      var active = document.activeElement;
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length); // iOS Safari
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      if (active && active.focus) active.focus();
      return ok;
    }
  </script>
</body>
</html>
